low_ocr_conf = 0.80
copilot_min_score = 2
memory_examples = 3
calibration_min_labels = 100

[app]
public_demo = true
max_input_chars = 20000
max_upload_mb = 2

[paths]
pdfs = "knowledge/pdfs"
build = "knowledge/build"
db = "data/claimguard.db"
