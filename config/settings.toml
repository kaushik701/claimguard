[llm]
primary = "groq"
fallback = "gemini"
extract_model = "llama-3.3-70b-versatile"
judge_model = "llama-3.3-70b-versatile"
verifier_model = "gemini-2.5-flash"
vision_model = "gemini-2.5-flash"
tagger_model = "llama-3.3-70b-versatile"
copilot_model = "llama-3.3-70b-versatile"
timeout_s = 60
max_retries = 2

[retrieval]
embedding_model = "BAAI/bge-small-en-v1.5"
bm25_k = 30
dense_k = 30
rrf_k = 60
rerank_top = 15
final_k = 5
not_covered_score = 1

[thresholds]
