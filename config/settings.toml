[llm]
primary = "groq"
fallback = "gemini"
# Groq retired the Llama 3.x models on this account (404, checked 17 Oct 2026); gpt-oss is what is served.
# The verifier must be a different model from the judge: gpt-oss-20b (or Gemini when GEMINI_API_KEY is set).
extract_model = "openai/gpt-oss-120b"
judge_model = "openai/gpt-oss-120b"
verifier_model = "openai/gpt-oss-20b"
vision_model = "qwen/qwen3.8-27b"   # Groq vision model (pack images, infographic pages)
tagger_model = "openai/gpt-oss-20b"
rerank_model = "openai/gpt-oss-20b"
expand_model = "openai/gpt-oss-20b"
rewrite_model = "openai/gpt-oss-20b"
copilot_model = "openai/gpt-oss-120b"
# same-provider backup when a model hits its daily quota (separate quota per model on Groq)
backup_model = "openai/gpt-oss-20b"
timeout_s = 60
max_retries = 2
# USD per 1M tokens, for cost reporting (0 on the free tier; set your plan's prices)
price_in = 0.0
price_out = 0.0

[retrieval]
embedding_model = "BAAI/bge-small-en-v1.5"
bm25_k = 30
dense_k = 30
rrf_k = 60
rerank_top = 15
final_k = 5
not_covered_score = 1

[thresholds]
min_quote_chars = 20
low_ocr_conf = 0.80
copilot_min_score = 2
memory_examples = 3
calibration_min_labels = 100

[app]
public_demo = true
max_input_chars = 20000
max_upload_mb = 2

[paths]
pdfs = "knowledge/pdfs"
build = "knowledge/build"
db = "data/claimguard.db"
